name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, types and contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install (locked)
        run: uv sync --locked
      - name: Formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check (mypy --strict)
        run: uv run mypy
      - name: Committed JSON Schemas match the models
        run: uv run envgen schema check
      - name: Example blueprints are valid and canonical
        run: |
          for blueprint in examples/locations/*/location.blueprint.json; do
            uv run envgen blueprint validate "$blueprint"
            uv run envgen blueprint format --check "$blueprint"
          done

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install (locked)
        run: uv sync --locked
      - name: Unit, integration and contract tests
        run: uv run pytest --cov --cov-report=term
      - name: CLI smoke test
        run: |
          uv run envgen generate \
            -b examples/locations/dacha-forest-edge/location.blueprint.json \
            -r examples/recipes/dacha-overgrown.recipe.json \
            -o examples/overrides/dacha-forest-edge.designer-pass.overrides.json \
            -d build/ci-scene --preview --write-plan
          uv run envgen verify build/ci-scene/scene-manifest.json
      - name: Upload generated scene
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: ci-scene
          path: build/ci-scene

  package:
    name: Build and run the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: uv build
      - name: Install the wheel in a clean environment and run it
        run: |
          uv venv /tmp/wheel-env
          uv pip install --python /tmp/wheel-env dist/*.whl
          cd /tmp
          /tmp/wheel-env/bin/envgen blueprint validate "$GITHUB_WORKSPACE/examples/locations/dacha-forest-edge/location.blueprint.json"
          /tmp/wheel-env/bin/envgen generate -b "$GITHUB_WORKSPACE/examples/locations/minimal/location.blueprint.json" -d /tmp/wheel-out
          /tmp/wheel-env/bin/envgen verify /tmp/wheel-out/scene-manifest.json

  unity-importer:
    name: Unity importer core (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Package .meta files are complete and stable
        run: uv run --no-project python scripts/unity_package_meta.py --check
      - name: Core unit tests (manifest reader, content hash, geometry, planning)
        run: dotnet test integrations/unity/tests/EnvGen.Importer.Core.Tests
